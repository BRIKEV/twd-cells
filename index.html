<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Example app description" />
    <meta name="theme-color" content="#000000" />
    <title>twd-cells</title>
    <link rel="icon" href="images/favicon.svg" />

    <link rel="stylesheet" href="/src/css/main.css" />
  </head>
  <body>
    <app-index id="app-content"></app-index>

    <noscript>Please enable JavaScript to view this website.</noscript>

    <script type="module" src="/src/components/app-index.ts"></script>
    <script type="module">
      if (import.meta.env.DEV) {
        const { initTWD } = await import('twd-js/bundled');
        const tests = import.meta.glob('./**/*.twd.test.js');

        initTWD(tests, {
          open: true,
          position: 'left',
          search: true,                    // Enable search/filter in the sidebar (default: false)
          serviceWorker: true,             // Enable request mocking (default: true)
          serviceWorkerUrl: '/src/mock-sw.js', // Custom service worker path (default: '/mock-sw.js')
          // rootSelector: '#my-app',      // (Optional) Override the app root for screenDom queries
        });
      }
    </script>
  </body>
</html>
